<title>Munder Difflin プレビュー</title>
<style>

  .stage-viewport{ max-width:100%; overflow:auto; border-radius:6px; }

  .command-center h2{ margin:0 0 6px; font-size:17px; }

  .worker-state[data-state="idle"]{ background:#f6e6bb; color:#70541d; }
  .history{ list-style:none; margin:8px 0 0; padding:0; max-height:150px; overflow:auto; }

  .history time{ display:block; font-size:10px; color:#766750; margin-top:3px; }

  .stage{
    position:relative;
    width:900px;
    height:680px;
    background:repeating-linear-gradient(90deg, var(--floor-a) 0 40px, var(--floor-b) 40px 80px);

  .stage.has-background .desk-top{ visibility:hidden; }
  .stage.has-background .desk-label{ background:rgba(255,248,229,.93); border:1px solid #cbb78b; border-radius:5px; padding:2px 0; }

    position:absolute;
    width:130px;
    transform:translate(-50%, -100%);

    pointer-events:none;

    width:104px;

    height:96px;

    pointer-events:auto;
    will-change:left, top;

<p class="legend">
  実測表示：60秒以内は稼働中、5分未満は待機中、5分以上は退室中（半透明）。<br>
  稼働中はよく席を立ち、待機中はたまに、退室中は動きません。出歩く量が実際の稼働の濃さです。<br>
  見回り役が停止・未接続のときは、全員が訪問し合うデモ表示に切り替わります。
</p>

<script>
/* ============================================================
   ROSTER — ここが唯一の拡張点
   1体分（部屋・座標・アクセント色・7枚のsprite・セリフ）を
   足すだけで、その机に人が座って動き出す
   ============================================================ */
const ROSTER = [

    col:1, row:0,
    sprites:{
      idle:"Aurelia_01_idle_48x48.png", working:"Aurelia_02_working_48x48.png",
      back:"Aurelia_03_back_48x48.png",
      walkLeft:["Aurelia_04_walk_left_1_48x48.png","Aurelia_05_walk_left_2_48x48.png"],
      walkRight:["Aurelia_06_walk_right_1_48x48.png","Aurelia_07_walk_right_2_48x48.png"]
    },

    activity:{"source":"skill","skills":["mensetsu-kiroku"],"tools":["Grep","Glob"]},
    col:2, row:0,
    sprites:{
      idle:"Sylvia_01_idle_48x48.png", working:"Sylvia_02_working_48x48.png",
      back:"Sylvia_03_back_48x48.png",
      walkLeft:["Sylvia_04_walk_left_1_48x48.png","Sylvia_05_walk_left_2_48x48.png"],

    col:1, row:1,

      back:"Rosalie_03_back_48x48.png",
      walkLeft:["Rosalie_04_walk_left_1_48x48.png","Rosalie_05_walk_left_2_48x48.png"],

    },

  },

    activity:{"source":"skill","skills":["タスク整理","朝の準備"],"tools":["TodoWrite","ScheduleWakeup"]},
    col:1, row:2,
    sprites:{
      idle:"Iris_01_idle_48x48.png", working:"Iris_02_working_48x48.png",
      back:"Iris_03_back_48x48.png",
      walkLeft:["Iris_04_walk_left_1_48x48.png","Iris_05_walk_left_2_48x48.png"],
      walkRight:["Iris_06_walk_right_1_48x48.png","Iris_07_walk_right_2_48x48.png"]
    },
    lines:["次の期限は明後日です。","今日はここまでで十分ですわ。"]
  },
  {
    id:"colette", name:"コレット", room:"工房", accent:"#c9772e",
    activity:{"source":"codex","skills":[],"tools":[]},
    role:"構築（Codex）",
    col:2, row:2,
    sprites:{
      idle:"Colette_01_idle_48x48.png", working:"Colette_02_working_48x48.png",
      back:"Colette_03_back_48x48.png",
      walkLeft:["Colette_04_walk_left_1_48x48.png","Colette_05_walk_left_2_48x48.png"],
      walkRight:["Colette_06_walk_right_1_48x48.png","Colette_07_walk_right_2_48x48.png"]
    },
    lines:["ここ、組み直しておきます。","動くようになりました。"]
  }

/* レイアウト：3列 × 3行のグリッド */
const COL_X = [185, 450, 715];
const ROW_Y = [245, 395, 545];
const WALK_SPEED = 95;   // px/秒
const FRAME_MS   = 210;  // 歩行フレームの入れ替え

const stage = document.getElementById("stage");
const backgroundImage = document.createElement("img");
backgroundImage.onload = () => stage.classList.add("has-background");
backgroundImage.onerror = () => stage.classList.remove("has-background");
backgroundImage.src = "background.png";
let liveMode = false;
let modeGeneration = 0;

function makeAgent(def){
  const home = { x: COL_X[def.col], y: ROW_Y[def.row] };

  // 机
  const desk = document.createElement("div");
  desk.className = "desk";
  desk.style.left = home.x + "px";
  desk.style.top  = home.y + "px";
  desk.innerHTML =
    '<div class="desk-top"></div>' +
    '<div class="desk-label">' +
      '<div class="desk-room"><span class="accent-dot" style="background:' + def.accent + '"></span>' + def.room + '</div>' +
      '<div class="desk-name">' + def.name + '</div>' +
    '</div>';
  stage.appendChild(desk);
  const stateLabel = document.createElement("span");
  stateLabel.className = "desk-state";
  stateLabel.textContent = "デモ";
  desk.querySelector(".desk-name").appendChild(stateLabel);

  // キャラクター
  const spr = document.createElement("button");
  spr.type = "button";
  spr.onclick = () => showAgent(def.id);
  spr.setAttribute("aria-label", `${def.name}の詳細`);
  spr.className = "sprite";
  const bub = document.createElement("div");
  bub.className = "bubble";
  const img = document.createElement("img");
  img.alt = def.name;
  img.src = def.sprites.idle;
  spr.appendChild(bub);
  spr.appendChild(img);
  stage.appendChild(spr);

  const pos = { x: home.x, y: home.y };
  function place(){ spr.style.left = pos.x + "px"; spr.style.top = pos.y + "px"; }
  function set(src){ img.src = src; }
  function say(text){
    bub.textContent = text;
    bub.classList.add("show");
    setTimeout(()=> bub.classList.remove("show"), 2300);
  }
  function poseIdle(){ set(def.sprites.idle); }
  function poseWork(){ set(def.sprites.working); }

  /* 縦に動いてから横に動く。上りは後ろ姿、下りは正面を見せる */
  function walkTo(targetX, targetY = pos.y){
    const generation = modeGeneration;
    const epoch = self.motionEpoch;
    if (liveMode && self.state === "away") return Promise.resolve();
    self.walking = true;
    return new Promise(resolve=>{
      const stop = () => { if (epoch === self.motionEpoch) self.walking = false; resolve(); };
      let last = 0;
      function step(t){
        if (generation !== modeGeneration || epoch !== self.motionEpoch){ stop(); return; }
        if (!last) last = t;
        const dt = (t - last) / 1000; last = t;
        const dist = WALK_SPEED * dt;
        const dy = targetY - pos.y;
        if (Math.abs(dy) > dist){
          pos.y += Math.sign(dy) * dist;
          place();
          set(dy < 0 ? def.sprites.back : def.sprites.idle);
          requestAnimationFrame(step);
          return;
        }
        pos.y = targetY;
        const dx = targetX - pos.x;
        if (Math.abs(dx) <= dist){
          pos.x = targetX; place(); stop(); syncPose(); return;
        }
        pos.x += Math.sign(dx) * dist;
        place();
        const frames = dx > 0 ? def.sprites.walkRight : def.sprites.walkLeft;
        set(Math.floor(t / FRAME_MS) % 2 === 0 ? frames[0] : frames[1]);
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    });
  }

  /* 姿勢は必ず実測の状態に従わせる。デモ表示のときだけ自由に構えてよい */
  function syncPose(){
    if (self.walking) return;
    if (!liveMode){ poseIdle(); return; }
    self.state === "working" ? poseWork() : poseIdle();
  }

  place();
  poseIdle();
  /* state は実測の状態（working/idle/away）。デモ表示のあいだは null */
  const self = { def, home, pos, place, say, poseIdle, poseWork, syncPose, walkTo,
                 spr, desk, bub, stateLabel, state:null, walking:false, motionEpoch:0 };
  return self;
}

const agents = {};
ROSTER.forEach(def => agents[def.id] = makeAgent(def));

const sleep = ms => new Promise(r => setTimeout(r, ms));
const pick  = a => a[Math.floor(Math.random() * a.length)];

/* 自分以外の全員。部屋をまたいで訪ね合う（縦の移動が生まれる） */
function mates(me){
  return ROSTER.filter(d => d.id !== me.def.id).map(d => agents[d.id]);
}

/* 訪ね歩く頻度。実測表示では「動きの量」が実際の稼働の濃さに対応する。
   稼働中はよく出歩き、待機中はたまに、退室中は席を外していて動かない。 */
const VISIT_CHANCE = { demo:0.75, working:0.55, idle:0.25, away:0 };

async function agentLoop(me){
  const generation = modeGeneration;
  const cancelled = () => generation !== modeGeneration;
  await sleep(Math.random() * 2000); // 開始をばらけさせる
  while (!cancelled()){
    const epoch = me.motionEpoch;
    const interrupted = () => epoch !== me.motionEpoch;
    const state = liveMode ? (me.state || "away") : "demo";

    // 退室中：席に戻して動かさない
    if (state === "away"){
      if (me.pos.x !== me.home.x || me.pos.y !== me.home.y){
        await me.walkTo(me.home.x, me.home.y);
        if (cancelled()) return;
      }
      await sleep(2000);
      continue;
    }

    // 机で作業
    state === "idle" ? me.poseIdle() : me.poseWork();
    await sleep(1600 + Math.random() * 2000);
    if (cancelled()) return;
    if (interrupted()) continue;
    me.syncPose();
    await sleep(600 + Math.random() * 1000);
    if (cancelled()) return;
    if (interrupted()) continue;

    if (Math.random() < VISIT_CHANCE[state]){
      // 退室中の相手は訪ねない（そこに居ないため）
      const others = mates(me).filter(other => !liveMode || other.state !== "away");
      if (others.length){
        const target = pick(others);
        const side = target.home.x > me.home.x ? -64 : 64;
        await me.walkTo(target.home.x + side, target.home.y);
        if (cancelled()) return;
        if (interrupted()) continue;
        me.say(pick(me.def.lines));
        target.syncPose();
        await sleep(2000);
        if (cancelled()) return;
        if (interrupted()) continue;
        if (Math.random() < 0.5){ target.say(pick(target.def.lines)); await sleep(1900); }
        if (cancelled()) return;
        if (interrupted()) continue;
        await me.walkTo(me.home.x, me.home.y);
        if (cancelled()) return;
        target.syncPose();
      }
    }

    await sleep(1200 + Math.random() * 2500);
  }
}

Object.values(agents).forEach(agentLoop);

const STATE_LABELS = {working:"稼働中", idle:"待機中", away:"退室中"};
let centerOpen = false;
function setCenterOpen(open){
  centerOpen = open;
  const panel = document.getElementById("command-center");
  const toggle = document.getElementById("center-toggle");
  if (open) panel.classList.add("is-open"); else panel.classList.remove("is-open");
  toggle.setAttribute("aria-expanded", String(open));
  toggle.textContent = open ? "× コマンドセンターを閉じる" : "☰ コマンドセンター";
  if (!open) toggle.focus();
}
document.getElementById("center-toggle").onclick = () => setCenterOpen(!centerOpen);
document.onkeydown = event => {
  if (event.key === "Escape" && centerOpen){ setCenterOpen(false); event.preventDefault(); }
};
let lastSnapshot = null;
let selectedAgent = null;
const workerRows = {};
const formatTime = value => new Date(value).toLocaleString("ja-JP", {timeZone:"Asia/Tokyo"});
for (const def of ROSTER){
  const row = document.createElement("tr"), nameCell = document.createElement("td"), stateCell = document.createElement("td");
  const button = document.createElement("button"), badge = document.createElement("span");
  button.className = "worker-button"; button.type = "button"; button.textContent = def.name;
  button.onclick = () => showAgent(def.id);
  badge.className = "worker-state"; badge.textContent = "未接続";
  nameCell.appendChild(button); stateCell.appendChild(badge); row.appendChild(nameCell); row.appendChild(stateCell);
  document.getElementById("workers-body").appendChild(row);
  workerRows[def.id] = badge;
}
document.getElementById("card-close").onclick = () => {
  document.getElementById("agent-card").hidden = true;
  if (selectedAgent) agents[selectedAgent].spr.focus();
  selectedAgent = null;
};
function showAgent(id){
  setCenterOpen(true);
  selectedAgent = id;
  document.getElementById("agent-card").hidden = false;
  renderCard();
}
function renderCard(){
  if (!selectedAgent) return;
  const def = agents[selectedAgent].def;
  const record = lastSnapshot?.agents[def.id];
  document.getElementById("card-name").textContent = def.name;
  document.getElementById("card-room").textContent = "部屋：" + def.room;
  document.getElementById("card-skills").textContent = "担当：" + (def.role || def.activity.skills.join(" / "));
  document.getElementById("card-state").textContent = "現在：" + (liveMode && record ? STATE_LABELS[record.state] : "実測未接続（デモ表示）");
  document.getElementById("card-last-seen").textContent = record?.lastSeen
    ? "最後の活動：" + formatTime(record.lastSeen) : "活動はまだ検出されていません";
}
function renderHistory(id, entries, field, empty){
  const list = document.getElementById(id);
  list.replaceChildren();
  if (!Array.isArray(entries)){
    const item = document.createElement("li");
    item.textContent = "履歴を受信していません。更新したwatcher.pyを再起動してください。";
    list.appendChild(item); return;
  }
  const valid = entries.filter(entry => entry && typeof entry[field] === "string" &&
    entry[field].length <= 512 && Number.isFinite(Date.parse(entry.timestamp))).slice(0,30);
  for (const entry of valid){
    const item = document.createElement("li"), title = document.createElement("span"), time = document.createElement("time");
    title.textContent = entry[field] + (field === "filename" ? (entry.kind === "created" ? " · 新規" : " · 更新") : "");
    time.textContent = formatTime(entry.timestamp); time.dateTime = entry.timestamp;
    item.appendChild(title); item.appendChild(time); list.appendChild(item);
  }
  if (!valid.length){ const item = document.createElement("li"); item.textContent = empty; list.appendChild(item); }
}
function renderCenter(){
  const counts = {working:0,idle:0,away:0};
  for (const def of ROSTER){
    const state = liveMode ? lastSnapshot?.agents[def.id]?.state : null;
    workerRows[def.id].textContent = state ? STATE_LABELS[state] : "未接続";
    workerRows[def.id].dataset.state = state || "offline";
    if (state) counts[state]++;
  }
  document.getElementById("office-summary").textContent = liveMode
    ? `稼働 ${counts.working}名 · 待機 ${counts.idle}名 · 退室 ${counts.away}名`
    : "実測未接続 · オフィスはデモ表示です。履歴は前回受信分です。";
  renderHistory("task-history", lastSnapshot?.tasks, "skill", "スキル呼び出しはまだ検出されていません。");
  renderHistory("artifact-history", lastSnapshot?.artifacts, "filename", "見回り役の起動後、新規・更新ファイルをここに表示します。");
  renderCard();
}
renderCenter();
const STALE_MS = 20000;
function statusError(message){
  const error = new Error(message);
  error.statusMessage = message;
  return error;
}
function validateStatus(data, now = Date.now()){
  const updated = Date.parse(data?.updatedAt);
  if (!Number.isFinite(updated) || !data.agents || typeof data.agents !== "object")
    throw statusError("稼働データの形式が不正です。watcher.pyの表示を確認してください");
  if (updated > now + 5000)
    throw statusError("稼働データが未来の時刻です。PCの時刻を確認してください");
  if (now - updated > STALE_MS){
    const time = new Date(updated).toLocaleTimeString("ja-JP", {timeZone:"Asia/Tokyo"});
    throw statusError(`見回り役の更新が停止しています（最終更新 ${time}・${Math.floor((now-updated)/1000)}秒前）。watcher.pyのターミナルを確認してください`);
  }
  for (const def of ROSTER){
    const record = data.agents[def.id];
    if (!record || !Object.hasOwn(STATE_LABELS, record.state) ||
        !(record.detail === null || typeof record.detail === "string") ||
        !(record.lastSeen === null || (typeof record.lastSeen === "string" &&
          Number.isFinite(Date.parse(record.lastSeen)) && Date.parse(record.lastSeen) <= updated + 5000)) ||
        (record.lastSeen === null && record.state !== "away"))
      throw statusError("キャラクターの稼働データが不正です。watcher.pyを確認してください");
  }
  return data;
}

function changeMode(live){
  if (live === liveMode) return;
  liveMode = live;
  modeGeneration++;   // 走っている歩行ループを打ち切り、全員を席に戻す
  for (const me of Object.values(agents)){
    me.motionEpoch++;
    me.pos.x = me.home.x; me.pos.y = me.home.y; me.place();
    me.bub.classList.remove("show");
    me.walking = false;
    if (!live){
      me.state = null;
      delete me.spr.dataset.state; delete me.desk.dataset.state;
      me.stateLabel.textContent = "デモ";
      me.spr.setAttribute("aria-label", `${me.def.name}：デモ`);
    }
    me.poseIdle();
  }
  Object.values(agents).forEach(agentLoop);
}

function applyStatus(data){
  lastSnapshot = data;
  changeMode(true);
  for (const def of ROSTER){
    const me = agents[def.id], record = data.agents[def.id];
    if (record.state === "away" && me.state !== "away"){
      me.motionEpoch++;
      me.walking = false;
      me.pos.x = me.home.x; me.pos.y = me.home.y; me.place();
      me.bub.classList.remove("show");
    }
    me.state = record.state;
    me.spr.dataset.state = me.desk.dataset.state = record.state;
    me.stateLabel.textContent = STATE_LABELS[record.state];
    me.spr.setAttribute("aria-label", `${def.name}：${STATE_LABELS[record.state]}`);
    if (!me.walking) me.syncPose();   // 歩いている最中の絵は上書きしない
  }
  const warning = data.sources && Object.values(data.sources).some(value => value !== "ok");
  document.getElementById("connection").textContent =
    "実測表示 — 更新 " + new Date(data.updatedAt).toLocaleTimeString("ja-JP", {timeZone:"Asia/Tokyo"}) +
    (warning ? "（一部の監視元が未検出・読み取りエラー）" : "");
  renderCenter();
}

async function pollStatus(){
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 2500);
  try {
    const response = await fetch('status.json', {cache:"no-store", signal:controller.signal});
    if (!response.ok) throw statusError(response.status === 404
      ? "status.jsonが見つかりません。見回り役の起動とサーバーの作業フォルダを確認してください"
      : `稼働データを取得できません（HTTP ${response.status}）。サーバーを確認してください`);
    let data;
    try { data = await response.json(); }
    catch (error){
      if (error.name === "AbortError") throw error;
      throw statusError("status.jsonを読み取れません。watcher.pyの表示を確認してください");
    }
    applyStatus(validateStatus(data));
  } catch (error) {
    changeMode(false);
    renderCenter();
    document.getElementById("connection").textContent = "デモ表示 — " +
      (error.statusMessage || (error.name === "AbortError"
        ? "サーバーの応答が時間切れになりました。HTTPサーバーを確認してください"
        : "サーバーに接続できません。HTTPサーバーのターミナルを確認してください"));
  } finally {
    clearTimeout(timeout);
    setTimeout(pollStatus, 4000);
  }
}
pollStatus();
</script>
