<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Munder Difflin プレビュー</title>
<style>
  :root{
    --floor-a:#e9e2d6;
    --floor-b:#ddd3c2;
    --wall:#f6f1e8;
    --ink:#3a332b;
    --ink-soft:#8a8175;
    --desk:#b98a5a;
    --desk-dark:#8f6a42;
    --card:#ffffff;
    --line:#d8cdb9;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:#2b2620;
    color:var(--ink);
    font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 16px 60px;
  }
  h1{
    color:#f3ead9;
    font-size:18px;
    letter-spacing:.08em;
    margin:0 0 4px;
  }
  .sub{
    color:#c9bfae;
    font-size:12.5px;
    margin:0 0 20px;
    letter-spacing:.04em;
  }
  .stage{
    position:relative;
    width:900px;
    max-width:100%;
    height:680px;
    background:repeating-linear-gradient(90deg, var(--floor-a) 0 40px, var(--floor-b) 40px 80px);
    border:10px solid var(--wall);
    border-radius:6px;
    box-shadow:0 20px 50px rgba(0,0,0,.45);
    overflow:hidden;
  }
  .desk{
    position:absolute;
    width:130px;
    transform:translate(-50%, -100%);
    text-align:center;
    pointer-events:none;
  }
  .desk-top{
    width:104px;
    height:44px;
    margin:0 auto;
    background:linear-gradient(180deg, var(--desk), var(--desk-dark));
    border-radius:4px;
    box-shadow:0 3px 0 rgba(0,0,0,.25), inset 0 2px 4px rgba(255,255,255,.2);
  }
  .desk-label{ margin-top:6px; font-size:11px; line-height:1.5 }
  .desk-room{ font-weight:700; color:var(--ink) }
  .desk-name{ font-size:10.5px; color:var(--ink-soft) }
  .accent-dot{
    display:inline-block;
    width:6px; height:6px;
    border-radius:50%;
    margin-right:4px;
    vertical-align:middle;
  }

  .sprite{
    position:absolute;
    width:144px;
    height:144px;
    transform:translate(-50%, -100%);
    pointer-events:none;
    will-change:left, top;
  }
  .sprite img{
    width:100%;
    height:100%;
    display:block;
    image-rendering:pixelated;
    image-rendering:-moz-crisp-edges;
  }
  .bubble{
    position:absolute;
    left:50%;
    top:-8px;
    transform:translate(-50%,-100%);
    background:var(--card);
    border:1px solid var(--line);
    border-radius:8px;
    padding:3px 9px;
    font-size:10.5px;
    white-space:nowrap;
    color:var(--ink);
    opacity:0;
    transition:opacity .25s ease;
    box-shadow:0 4px 10px rgba(0,0,0,.15);
  }
  .bubble.show{ opacity:1 }
  .bubble::after{
    content:"";
    position:absolute;
    left:50%;
    top:100%;
    transform:translateX(-50%);
    border:5px solid transparent;
    border-top-color:var(--card);
  }

  .legend{
    margin-top:16px;
    color:#b9ae9b;
    font-size:11px;
    text-align:center;
    line-height:1.8;
  }
  .legend b{ color:#e7dcc6 }
</style>
</head>
<body>

<h1>Munder Difflin — 制作中プレビュー</h1>
<p class="sub">9部屋・9名が稼働中。背景とUIパネルはCodex復活後に本実装します。</p>

<div class="stage" id="stage"></div>

<p class="legend">
  各自が自分の机で作業しつつ、時々同じ列の誰かを訪ねて一言交わします。<br>
  動きは仮のループです。実際のファイル更新と連動させるのは今後の実装。
</p>

<script>
/* ============================================================
   ROSTER — ここが唯一の拡張点
   1体分（部屋・座標・アクセント色・7枚のsprite・セリフ）を
   足すだけで、その机に人が座って動き出す
   ============================================================ */
const ROSTER = [
  {
    id:"clarice", name:"クラリス", room:"受付の間", accent:"#6a4fa0",
    col:0, row:1,
    sprites:{
      idle:"Clarice_00_idle_48x48.png", working:"Clarice_01_working_48x48.png",
      walkLeft:["Clarice_04_walk_left_1_48x48.png","Clarice_05_walk_left_2_48x48.png"],
      walkRight:["Clarice_06_walk_right_1_48x48.png","Clarice_07_walk_right_2_48x48.png"]
    },
    lines:["みなさん、進み具合はいかがですか？","台帳に控えておきますわ。"]
  },
  {
    id:"verity", name:"ヴェリティ", room:"調査室", accent:"#b8433a",
    col:0, row:0,
    sprites:{
      idle:"Verity_01_idle_48x48.png", working:"Verity_02_working_48x48.png",
      walkLeft:["Verity_04_walk_left_1_48x48.png","Verity_05_walk_left_2_48x48.png"],
      walkRight:["Verity_06_walk_right_1_48x48.png","Verity_07_walk_right_2_48x48.png"]
    },
    lines:["この会社、少し気になりますね。","裏を取ってまいります。"]
  },
  {
    id:"aurelia", name:"オーレリア", room:"準備の間", accent:"#b07c1e",
    col:1, row:0,
    sprites:{
      idle:"Aurelia_01_idle_48x48.png", working:"Aurelia_02_working_48x48.png",
      walkLeft:["Aurelia_04_walk_left_1_48x48.png","Aurelia_05_walk_left_2_48x48.png"],
      walkRight:["Aurelia_06_walk_right_1_48x48.png","Aurelia_07_walk_right_2_48x48.png"]
    },
    lines:["その答え方、とても良いですよ。","本番のつもりでいきましょう。"]
  },
  {
    id:"sylvia", name:"シルヴィア", room:"記録の間", accent:"#2f6b4f",
    col:2, row:0,
    sprites:{
      idle:"Sylvia_01_idle_48x48.png", working:"Sylvia_02_working_48x48.png",
      walkLeft:["Sylvia_04_walk_left_1_48x48.png","Sylvia_05_walk_left_2_48x48.png"],
      walkRight:["Sylvia_06_walk_right_1_48x48.png","Sylvia_07_walk_right_2_48x48.png"]
    },
    lines:["先ほどの要点、まとめました。","記録に残しておきます。"]
  },
  {
    id:"celine", name:"セリーヌ", room:"文机の間", accent:"#3b4b8a",
    col:1, row:1,
    sprites:{
      idle:"Celine_01_idle_48x48.png", working:"Celine_02_working_48x48.png",
      walkLeft:["Celine_04_walk_left_1_48x48.png","Celine_05_walk_left_2_48x48.png"],
      walkRight:["Celine_06_walk_right_1_48x48.png","Celine_07_walk_right_2_48x48.png"]
    },
    lines:["文面、整えておきますわ。","この一文は削りましょう。"]
  },
  {
    id:"lumiere", name:"リュミエール", room:"画室", accent:"#3f9bb0",
    col:2, row:1,
    sprites:{
      idle:"Lumiere_01_idle_48x48.png", working:"Lumiere_02_working_48x48.png",
      walkLeft:["Lumiere_04_walk_left_1_48x48.png","Lumiere_05_walk_left_2_48x48.png"],
      walkRight:["Lumiere_06_walk_right_1_48x48.png","Lumiere_07_walk_right_2_48x48.png"]
    },
    lines:["いま描いております。","もう少しで仕上がります。"]
  },
  {
    id:"rosalie", name:"ロザリー", room:"聞き取りの間", accent:"#c46a86",
    col:0, row:2,
    sprites:{
      idle:"Rosalie_01_idle_48x48.png", working:"Rosalie_02_working_48x48.png",
      walkLeft:["Rosalie_04_walk_left_1_48x48.png","Rosalie_05_walk_left_2_48x48.png"],
      walkRight:["Rosalie_06_walk_right_1_48x48.png","Rosalie_07_walk_right_2_48x48.png"]
    },
    lines:["もう少し詳しく伺えますか？","なるほど、そういうことですね。"]
  },
  {
    id:"iris", name:"イリス", room:"手帳の間", accent:"#9b8fc2",
    col:1, row:2,
    sprites:{
      idle:"Iris_01_idle_48x48.png", working:"Iris_02_working_48x48.png",
      walkLeft:["Iris_04_walk_left_1_48x48.png","Iris_05_walk_left_2_48x48.png"],
      walkRight:["Iris_06_walk_right_1_48x48.png","Iris_07_walk_right_2_48x48.png"]
    },
    lines:["次の期限は明後日です。","今日はここまでで十分ですわ。"]
  },
  {
    id:"colette", name:"コレット", room:"工房", accent:"#c9772e",
    col:2, row:2,
    sprites:{
      idle:"Colette_01_idle_48x48.png", working:"Colette_02_working_48x48.png",
      walkLeft:["Colette_04_walk_left_1_48x48.png","Colette_05_walk_left_2_48x48.png"],
      walkRight:["Colette_06_walk_right_1_48x48.png","Colette_07_walk_right_2_48x48.png"]
    },
    lines:["ここ、組み直しておきます。","動くようになりました。"]
  }
];

/* レイアウト：3列 × 3行のグリッド */
const COL_X = [150, 450, 750];
const ROW_Y = [190, 410, 620];
const WALK_SPEED = 95;   // px/秒
const FRAME_MS   = 210;  // 歩行フレームの入れ替え

const stage = document.getElementById("stage");

function makeAgent(def){
  const home = { x: COL_X[def.col], y: ROW_Y[def.row] };

  // 机
  const desk = document.createElement("div");
  desk.className = "desk";
  desk.style.left = home.x + "px";
  desk.style.top  = home.y + "px";
  desk.innerHTML =
    '<div class="desk-top"></div>' +
    '<div class="desk-label">' +
      '<div class="desk-room"><span class="accent-dot" style="background:' + def.accent + '"></span>' + def.room + '</div>' +
      '<div class="desk-name">' + def.name + '</div>' +
    '</div>';
  stage.appendChild(desk);

  // キャラクター
  const spr = document.createElement("div");
  spr.className = "sprite";
  const bub = document.createElement("div");
  bub.className = "bubble";
  const img = document.createElement("img");
  img.alt = def.name;
  img.src = def.sprites.idle;
  spr.appendChild(bub);
  spr.appendChild(img);
  stage.appendChild(spr);

  const pos = { x: home.x, y: home.y };
  function place(){ spr.style.left = pos.x + "px"; spr.style.top = pos.y + "px"; }
  function set(src){ img.src = src; }
  function say(text){
    bub.textContent = text;
    bub.classList.add("show");
    setTimeout(()=> bub.classList.remove("show"), 2300);
  }
  function poseIdle(){ set(def.sprites.idle); }
  function poseWork(){ set(def.sprites.working); }

  function walkTo(targetX){
    return new Promise(resolve=>{
      const frames = targetX > pos.x ? def.sprites.walkRight : def.sprites.walkLeft;
      let last = 0;
      function step(t){
        if (!last) last = t;
        const dt = (t - last) / 1000; last = t;
        const remaining = targetX - pos.x;
        const dist = WALK_SPEED * dt;
        if (Math.abs(remaining) <= dist){
          pos.x = targetX; place(); poseIdle(); resolve(); return;
        }
        pos.x += Math.sign(remaining) * dist;
        place();
        set(Math.floor(t / FRAME_MS) % 2 === 0 ? frames[0] : frames[1]);
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    });
  }

  place();
  poseIdle();
  return { def, home, pos, place, say, poseIdle, poseWork, walkTo };
}

const agents = {};
ROSTER.forEach(def => agents[def.id] = makeAgent(def));

const sleep = ms => new Promise(r => setTimeout(r, ms));
const pick  = a => a[Math.floor(Math.random() * a.length)];

/* 同じ列（row）にいる他のagentを返す */
function rowMates(me){
  return ROSTER.filter(d => d.row === me.def.row && d.id !== me.def.id)
               .map(d => agents[d.id]);
}

async function agentLoop(me){
  await sleep(Math.random() * 6000); // 開始をばらけさせる
  while (true){
    // 机で作業
    me.poseWork();
    await sleep(3000 + Math.random() * 4000);
    me.poseIdle();
    await sleep(1200 + Math.random() * 2500);

    // 6割の確率で、同じ列の誰かを訪ねる
    if (Math.random() < 0.6){
      const mates = rowMates(me);
      if (mates.length){
        const target = pick(mates);
        const side = target.home.x > me.home.x ? -64 : 64;
        await me.walkTo(target.home.x + side);
        me.say(pick(me.def.lines));
        target.poseIdle();
        await sleep(2400);
        if (Math.random() < 0.5){ target.say(pick(target.def.lines)); await sleep(2200); }
        await me.walkTo(me.home.x);
        target.poseWork();
      }
    }

    await sleep(3000 + Math.random() * 6000);
  }
}

Object.values(agents).forEach(agentLoop);
</script>
</body>
</html>
